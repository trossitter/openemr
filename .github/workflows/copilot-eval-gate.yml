name: Copilot Eval Gate

on:
  push:
    paths:
      - 'copilot/**'
  pull_request:
    paths:
      - 'copilot/**'

jobs:
  eval-gate:
    name: Eval Gate (50 cases, 5 rubrics)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: copilot

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: copilot/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run eval gate
        run: python -m pytest evals/test_eval.py -v --tb=short
        env:
          # Rubric tests use static simulated data — no live API keys needed
          ANTHROPIC_API_KEY: "test-key-not-used-in-static-evals"
          COHERE_API_KEY: "test-key-not-used-in-static-evals"
          COPILOT_SECRET: "ci-secret"
          COPILOT_DEMO_MODE: "true"
          CHROMA_PERSIST_DIR: "/tmp/chroma-ci"
